# Sizing-focused overrides (heavier SAC settings for sizing experiments).
seed: 42
device: cpu
output_dir: outputs/mb_sac

sac:
  hidden_dim: 256
  gamma: 0.99
  tau: 0.005
  lr: 0.0003
  init_alpha: 0.2
  auto_alpha: true
  real_batch_fraction: 0.8
  rollout_horizon: 5
  batch_size: 64
  updates_per_episode: 8
  dynamics_updates_per_episode: 4
  sizing_steps: 16

budgets:
  max_topology_edits: 2
  max_sizing_steps: 32
  max_spice_calls: 24
  max_runtime_s: 900.0
  max_generations: 1
  max_retrievals: 2
