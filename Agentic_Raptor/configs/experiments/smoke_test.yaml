# Smoke test: small budgets, multimodal inputs, mock everything, deterministic.
seed: 7
device: cpu
output_dir: ../../outputs/smoke

logging:
  level: INFO
  decision_log: ../../outputs/smoke/decisions.jsonl

specification:
  text: |
    Design a low-power OTA. Gain >= 70 dB, phase margin >= 55 deg.
  structured_specification_path: inputs/smoke_spec.yaml
  table_path: inputs/smoke_table.csv
  netlist_path: inputs/smoke_reference.sp
  schematic_image_path: null
  defaults:
    temperature_c: 27.0

actions:
  max_edits: 4
  max_actions: 24
  invalid_action_penalty: -0.5

mcts:
  num_simulations: 12
  c_puct: 1.5
  max_depth: 3
  pw_c: 2.0
  pw_alpha: 0.5
  pw_min: 2

policy_value:
  hidden_dim: 32
  encoder: pooled
  lr: 0.001
  value_loss_weight: 1.0
  batch_size: 8
  updates_per_episode: 2

sac:
  hidden_dim: 32
  gamma: 0.99
  tau: 0.01
  lr: 0.001
  init_alpha: 0.2
  auto_alpha: true
  real_batch_fraction: 0.7
  rollout_horizon: 2
  batch_size: 8
  updates_per_episode: 2
  dynamics_updates_per_episode: 2
  sizing_steps: 3

spice:
  simulator: mock
  analyses: [op, ac]
  timeout_s: 5.0
  cache_path: null
  pvt_corners: 2

budgets:
  max_topology_edits: 4
  max_sizing_steps: 6
  max_spice_calls: 8
  max_runtime_s: 120.0
  max_generations: 2
  max_retrievals: 3

reward_weights:
  feasibility_weight: 1.0
  fom_weight: 0.5
  pvt_weight: 0.3
  spice_cost_weight: 0.1
  runtime_weight: 0.05
  invalidity_weight: 0.5
  validity_weight: 0.2
  sizing_progress_weight: 0.2
  fom_scale: 200.0
  credit_gamma: 0.97
  shaping_blend: 0.0

rag:
  persist_path: null          # in-memory only for the smoke test
  top_k: 3
  include_failures: true
  seed_corpus: true

llm:
  generator: mock
  number_of_candidates: 2
  max_retries: 1

coordinator:
  accept_reward_threshold: 0.5
  stagnation_patience: 2
  max_repeated_failures: 3
  max_decisions: 25
